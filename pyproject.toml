[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdbricks"
version = "0.1.0"
description = "Batched NVIDIA MotionBricks: generate the motion of hundreds of characters in one model call."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
# MotionBricks itself is not on PyPI: install it from https://github.com/NVlabs/motionbricks and put the
# checkout on PYTHONPATH (crowdbricks also uses its app package). These come with it.
dependencies = ["numpy", "warp-lang>=1.17.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["crowdbricks*"]
